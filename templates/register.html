<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HylightX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            color: #e5e5e5;
            display: flex;
            flex-direction: column;
        }
        .gradient-text {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .navbar {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 1rem 0;
        }
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }
        .auth-card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        .card-header {
            background: linear-gradient(135deg, rgba(168,85,247,0.15), rgba(59,130,246,0.15));
            padding: 2.5rem 2rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .card-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .card-header p {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 0;
        }
        .card-body { 
            padding: 2.5rem 2rem; 
        }
        .form-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #e5e5e5;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .form-label i { color: #a855f7; }

        .form-control {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 1rem;
            color: #f0f0f0;
            padding: 0.8rem 1.2rem;
            font-size: 0.95rem;
            transition: all 0.2s;
            width: 100%;
        }
        .form-control:focus {
            background: #252525;
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168,85,247,0.2);
            color: white;
            outline: none;
        }
        .form-control::placeholder {
            color: #6b7280;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            margin-top: 1rem;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(168,85,247,0.4);
            color: white;
        }

        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .auth-links a {
            color: #a855f7;
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 600;
        }
        .auth-links a:hover {
            color: #d8b4fe;
            text-decoration: underline;
        }
        .text-muted-custom {
            color: #9ca3af;
        }

        .alert-error {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            color: #f87171;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container-fluid d-flex justify-content-center position-relative">
        <a class="navbar-brand text-white text-decoration-none" href="/">
            <i class="fas fa-magic me-2" style="color: #a855f7;"></i> Hylight<span class="gradient-text">X</span>
        </a>
    </div>
</nav>

<div class="main-content">
    <div class="auth-card">
        <div class="card-header">
            <h1>Create <span class="gradient-text">Account</span></h1>
            <p>Sign up to start creating highlights</p>
        </div>

        <div class="card-body">
            {% if error %}
            <div class="alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <a href="{{ url_for('login_google') }}" class="btn btn-outline-light w-100 mb-3 d-flex align-items-center justify-content-center" style="border-radius: 8px; padding: 12px; font-weight: 500; background-color: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); transition: all 0.3s ease;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" style="height: 20px; margin-right: 10px;">
                Continue with Google
            </a>
            
            <div class="d-flex align-items-center my-4">
                <hr class="flex-grow-1" style="border-color: rgba(255,255,255,0.1);">
                <span class="mx-3 text-secondary" style="font-size: 0.85rem;">OR</span>
                <hr class="flex-grow-1" style="border-color: rgba(255,255,255,0.1);">
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-4">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary-custom">
                    Sign Up <i class="fas fa-user-plus ms-2"></i>
                </button>
            </form>

            <div class="auth-links">
                <span class="text-muted-custom">Already have an account?</span> <a href="{{ url_for('login') }}">Login</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
