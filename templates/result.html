<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HylightX – Your AI Highlights</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #0a0a0a;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #e5e5e5;
        }
        .navbar {
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 1rem 0;
        }
        .navbar-brand {
            font-size: 1.6rem;
            font-weight: 800;
        }
        .gradient-text {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .result-card {
            background: rgba(20,20,20,0.8);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .result-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: linear-gradient(135deg, rgba(168,85,247,0.1), rgba(59,130,246,0.05));
        }
        .result-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
        }
        .main-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            padding: 2rem;
        }
        .video-panel {
            flex: 2;
            min-width: 280px;
        }
        .info-panel {
            flex: 1.2;
            min-width: 260px;
        }
        .video-wrapper {
            background: #000;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
            max-height: 400px;
            object-fit: contain;
            background: #000;
        }
        .info-card {
            background: #131313;
            border-radius: 1.2rem;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border: 1px solid #2c2c2c;
        }
        .info-card h5 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border-left: 3px solid #a855f7;
            padding-left: 0.7rem;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }
        .info-label {
            color: #9ca3af;
        }
        .info-value {
            font-weight: 500;
            color: #c084fc;
        }
        .highlights-scroll {
            max-height: 320px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .highlight-item {
            background: #1e1e1e;
            border-left: 3px solid #a855f7;
            border-radius: 0.8rem;
            padding: 0.8rem;
            margin-bottom: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .highlight-item:hover {
            background: #2a2a2a;
            transform: translateX(4px);
        }
        .highlight-timestamp {
            font-weight: 700;
            color: #a855f7;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }
        .highlight-description {
            font-size: 0.8rem;
            color: #cbd5e1;
            line-height: 1.4;
        }
        .btn-custom {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-outline-custom {
            background: transparent;
            border: 1px solid #a855f7;
            color: #a855f7;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
        }
        .btn-outline-custom:hover {
            background: rgba(168,85,247,0.1);
            color: white;
        }
        .btn-custom:hover, .btn-outline-custom:hover {
            transform: translateY(-2px);
        }
        .processing-overlay {
            text-align: center;
            padding: 3rem;
        }
        .spinner-custom {
            width: 50px;
            height: 50px;
            border: 4px solid #2c2c2c;
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-custom {
            height: 6px;
            background: #2c2c2c;
            border-radius: 3px;
            margin: 1rem auto;
            width: 80%;
        }
        .progress-bar-custom {
            height: 100%;
            background: linear-gradient(90deg, #a855f7, #3b82f6);
            width: 0%;
            border-radius: 3px;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 5px; }
        @media (max-width: 768px) {
            .main-grid { flex-direction: column; padding: 1.2rem; }
            .video-wrapper video { max-height: 280px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container-fluid d-flex justify-content-center">
        <a class="navbar-brand text-white" href="/">
            <i class="fas fa-magic me-2" style="color: #a855f7;"></i> Hylight<span class="gradient-text">X</span>
        </a>
    </div>
</nav>

<div class="container">
    <div class="result-card">
        <div class="result-header">
            <h1><i class="fas fa-magic me-2" style="color: #a855f7;"></i> Your Highlight Video</h1>
            <p class="text-secondary mb-0">AI‑powered, ready in seconds</p>
        </div>

        <div id="processingContent" class="processing-overlay">
            <div class="spinner-custom"></div>
            <h5>Processing your video...</h5>
            <div class="progress-custom"><div id="progressBar" class="progress-bar-custom"></div></div>
            <p id="statusDetail" class="text-secondary"><i class="fas fa-spinner fa-spin me-1"></i> Analyzing frames</p>
        </div>

        <div id="completedContent" style="display: none;">
            <div class="main-grid">
                <!-- Left: Video player -->
                <div class="video-panel">
                    <div class="video-wrapper">
                        <video id="highlightVideo" controls>
                            <source id="videoSource" src="" type="video/mp4">
                        </video>
                    </div>
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <button class="btn-custom" id="downloadBtn"><i class="fas fa-download me-1"></i> Download</button>
                        <button class="btn-outline-custom" id="newVideoBtn"><i class="fas fa-plus me-1"></i> New Video</button>
                    </div>
                </div>

                <!-- Right: Info + Timestamps -->
                <div class="info-panel">
                    <div class="info-card">
                        <h5><i class="fas fa-info-circle me-2"></i> Details</h5>
                        <div class="info-row"><span class="info-label">Your prompt:</span><span class="info-value" id="promptText">-</span></div>
                        <div class="info-row"><span class="info-label">Highlights found:</span><span class="info-value" id="highlightsCount">0</span></div>
                        <div class="info-row"><span class="info-label">Processing time:</span><span class="info-value" id="processingTime">-</span></div>
                    </div>
                    <div class="info-card">
                        <h5><i class="fas fa-clock me-2"></i> Highlight moments</h5>
                        <div id="highlightsList" class="highlights-scroll">
                            <div class="text-secondary text-center py-3">Loading timestamps...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function getJobIdFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        let jobId = urlParams.get('job_id');
        if (!jobId) {
            const parts = window.location.pathname.split('/');
            const idx = parts.indexOf('result');
            if (idx !== -1 && parts.length > idx+1) jobId = parts[idx+1];
        }
        return jobId;
    }
    const jobId = getJobIdFromUrl();
    let pollInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
        if (!jobId) { alert('No job ID. Redirecting...'); window.location.href='/'; return; }
        startPolling();
        document.getElementById('downloadBtn')?.addEventListener('click', () => window.location.href=`/download/${jobId}`);
        document.getElementById('newVideoBtn')?.addEventListener('click', () => window.location.href='/');
    });

    function startPolling() {
        let step = 0;
        const steps = ['Extracting frames', 'AI analysis', 'Matching highlights', 'Rendering video'];
        pollInterval = setInterval(async () => {
            try {
                const res = await fetch(`/status/${jobId}`);
                const data = await res.json();
                if (data.status === 'processing') {
                    step = Math.min(step + 0.05, 3.5);
                    const prog = (step / 3.5) * 100;
                    document.getElementById('progressBar').style.width = prog + '%';
                    document.getElementById('statusDetail').innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${steps[Math.floor(step)]}...`;
                } else if (data.status === 'completed') {
                    clearInterval(pollInterval);
                    showResults(data);
                } else if (data.status === 'failed') {
                    clearInterval(pollInterval);
                    alert('Processing failed: ' + (data.error || 'Unknown error'));
                    window.location.href='/';
                }
            } catch(e) { console.error(e); }
        }, 2500);
    }

    async function showResults(data) {
        document.getElementById('processingContent').style.display = 'none';
        document.getElementById('completedContent').style.display = 'block';
        const videoSrc = `/preview/${jobId}`;
        document.getElementById('videoSource').src = videoSrc;
        document.getElementById('highlightVideo').load();

        const storedPrompt = localStorage.getItem(`prompt_${jobId}`) || data.prompt || '—';
        document.getElementById('promptText').innerText = storedPrompt;
        document.getElementById('highlightsCount').innerText = data.matches_count || 0;
        document.getElementById('processingTime').innerText = data.processing_time || 'Calculating...';

        // fetch detailed highlights if not already in data
        let highlights = data.highlights || [];
        if (!highlights.length) {
            try {
                const resp = await fetch(`/api/highlights/${jobId}`);
                const json = await resp.json();
                if (json.highlights) highlights = json.highlights;
            } catch(e) {}
        }
        displayHighlights(highlights);
    }

    function displayHighlights(highlights) {
        const container = document.getElementById('highlightsList');
        if (!container) return;
        if (!highlights || highlights.length === 0) {
            container.innerHTML = '<div class="text-secondary text-center py-3">✨ No highlights matched</div>';
            return;
        }
        container.innerHTML = '';
        highlights.forEach(h => {
            const ts = typeof h === 'object' ? h.timestamp : h;
            const desc = typeof h === 'object' ? (h.description || 'Highlight') : `Highlight at ${formatTime(ts)}`;
            const div = document.createElement('div');
            div.className = 'highlight-item';
            div.onclick = () => seekTo(ts);
            div.innerHTML = `
                <div class="highlight-timestamp"><i class="fas fa-tag me-1"></i> ${formatTime(ts)}</div>
                <div class="highlight-description">${escapeHtml(desc)}</div>
            `;
            container.appendChild(div);
        });
    }

    function formatTime(sec) {
        if (sec === undefined) return '0:00';
        const mins = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${mins}:${s.toString().padStart(2,'0')}`;
    }
    function seekTo(t) {
        const vid = document.getElementById('highlightVideo');
        if (vid) { vid.currentTime = t; vid.play(); }
    }
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
</body>
</html>
