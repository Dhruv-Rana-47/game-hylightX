<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HylightX – Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #0a0a0a;
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: rgba(20,20,20,0.9);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2.5rem;
            text-align: center;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 35px -10px black;
        }
        .error-icon {
            font-size: 4rem;
            color: #f97316;
            margin-bottom: 1rem;
        }
        h2 {
            color: white;
            font-weight: 700;
        }
        .error-message {
            background: #1e1e1e;
            border-radius: 1rem;
            padding: 1rem;
            margin: 1.5rem 0;
            color: #facc15;
            font-family: monospace;
            word-break: break-word;
        }
        .btn-home {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 2rem;
            font-weight: 600;
            color: white;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(168,85,247,0.4);
        }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon"><i class="fas fa-exclamation-triangle"></i></div>
    <h2>Something went wrong</h2>
    <div class="error-message">{{ error }}</div>
    <button class="btn-home" onclick="window.location.href='/'">
        <i class="fas fa-arrow-left me-2"></i> Back to HylightX
    </button>
</div>
</body>
</html>
